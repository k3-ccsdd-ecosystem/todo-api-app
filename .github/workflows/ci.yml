name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: PR body has TASK and REQ
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -Eq 'TASK-[0-9]+' || { echo "PR 本文に TASK-n が無い"; exit 1; }
          echo "$BODY" | grep -Eq 'REQ-[0-9]+' || { echo "PR 本文に REQ-n が無い"; exit 1; }
